name: Storefront quality checks

on:
  push:
    branches:
      - main
      - design/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build (storefront only)
        env:
          NEXT_PUBLIC_STOREFRONT_ONLY: "true"
          NEXT_PUBLIC_APP_URL: "https://example.com"
        run: npm run build
