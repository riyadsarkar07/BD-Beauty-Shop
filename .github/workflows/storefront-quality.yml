name: Storefront quality checks

on:
  push:
    branches:
      - main
      - design/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      # Next.js 16 Turbopack has an intermittent remote Google-font loader
      # regression. Run the independent CI build with Webpack; Vercel still
      # verifies the normal production build for this repository.
      - name: Production build (storefront only, webpack fallback)
        env:
          NEXT_PUBLIC_STOREFRONT_ONLY: "true"
          NEXT_PUBLIC_APP_URL: "https://example.com"
        run: npm run build -- --webpack
